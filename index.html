<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>BURAK ERP</title>
</head>
<body style="margin:0;font:16px/1.5 system-ui,sans-serif">
<p id="ld" style="padding:24px;color:#5b6670">BURAK ERP yükleniyor…</p>
<script>
// Yükleyici: uygulamanın (app.html) en son yayınlanan sürümünü bulur ve açar.
// Yayın = depoya push + app_release tablosuna commit SHA'sı. GitHub Pages'in 1-2 dk'lık yayın gecikmesini atlar.
(async()=>{
 const SB='https://dkltytnndqweulawhgpa.supabase.co',K='sb_publishable_RjA7K6BqfH3ZKLTnmE8upw_mLu2DZqd';
 let html=null,id=0;
 try{
  const r=await fetch(SB+'/rest/v1/app_release?select=id,sha&order=id.desc&limit=1',{headers:{apikey:K},cache:'no-store'});
  const j=await r.json();
  if(j&&j[0]){id=j[0].id;const a=await fetch('https://raw.githubusercontent.com/bcoskun47-hash/burak-erp/'+j[0].sha+'/app.html');if(a.ok)html=await a.text()}
 }catch(e){}
 if(!html){try{const a=await fetch('app.html?t='+Date.now(),{cache:'no-store'});if(a.ok)html=await a.text()}catch(e){}}
 if(!html){document.getElementById('ld').textContent='Uygulama yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.';return}
 html=html.replace('<head>','<head><script>window.__RELEASE='+id+'<\/script>');
 document.open();document.write(html);document.close();
})();
</script>
</body>
</html>
